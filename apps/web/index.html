<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <!-- 1. Primary Page Title (Core SEO Factor) -->
    <title>Prairie Joy Baskets – Winnipeg Gift Baskets & Local Delivery</title>
    
    <!-- 2. Page Description (Appears under the link in Google search results) -->
    <meta 
      name="description" 
      content="Handcrafted gift baskets and luxury hampers delivered across Winnipeg and Manitoba. Perfect for corporate gifts, holidays, birthdays, and special occasions." 
    />

    <!-- 3. Keywords -->
    <meta 
      name="keywords" 
      content="Winnipeg gift baskets, Manitoba gift hampers, Prairie Joy Baskets, local Winnipeg gifts, corporate gift baskets Winnipeg" 
    />

    <!-- 4. Open Graph / Facebook Meta Tags (preview card when sharing on social media) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Prairie Joy Baskets – Handcrafted Gift Baskets in Winnipeg" />
    <meta property="og:description" content="Curated gourmet gift baskets featuring local Manitoba products. Fast Winnipeg delivery." />
    <meta property="og:image" content="https://prairiejoybaskets.ca/og-image.jpg" />
    <meta property="og:url" content="https://prairiejoybaskets.ca" />

    <!-- 5. Local SEO / Geotargeting (Helps Google map pack local rankings) -->
    <meta name="geo.region" content="CA-MB" />
    <meta name="geo.placename" content="Winnipeg" />
    
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  
  <!-- Rendered page from App.tsx via main.tsx -->
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
