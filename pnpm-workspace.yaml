# Create workspace definition file
# This file defines the root of a pnpm monorepo (workspace) 
# and tells pnpm which folders contain sub-projects or packages

packages:
  - "apps/*"      # Treats every folder inside /apps as an individual app (e.g. web, mobile, admin)
  - "packages/*"  # Treats every folder inside /packages as a shared library (e.g. ui, config, utils)
allowBuilds:
  esbuild: true
onlyBuiltDependencies:
  - esbuild
overrides:
  esbuild@<=0.24.2: ^0.25.0
  postcss-selector-parser@<7.1.6: ^7.1.6
  source-map-js@>=1.0.0 <1.2.2: ^1.2.2
  vite@<=6.4.1: ^6.4.2
  vite@<=6.4.2: ^6.4.3
