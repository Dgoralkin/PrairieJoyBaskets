# =========================
# This file is used to containerize the React web application for CI/CD pipeline deployment on Google Cloud Run via Cloud Build.
# It uses a multi-stage build to first build the API backend and then the React app and then serve it using Nginx.
# =========================

steps:
  # 1. Build Docker image for the API backend and push it to Artifact Registry
  # 1.1 Build and deploy the API Backend
  - name: 'gcr.io/cloud-builders/docker'
    args: 
      - 'build'
      - '-t'
      - 'northamerica-northeast1-docker.pkg.dev/prairiejoybaskets/pjb-arti-repo/prairiejoy-api:$COMMIT_SHA'
      - '-f'
      - 'apps/api/Dockerfile'
      - '.'
  # 1.2 Push image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'northamerica-northeast1-docker.pkg.dev/prairiejoybaskets/pjb-arti-repo/prairiejoy-api:$COMMIT_SHA'
  # 1.3 Deploy image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    args:
      - 'gcloud'
      - 'run'
      - 'deploy'
      - 'prairiejoy-api'
      - '--image'
      - 'northamerica-northeast1-docker.pkg.dev/prairiejoybaskets/pjb-arti-repo/prairiejoy-api:$COMMIT_SHA'
      - '--region'
      - 'northamerica-northeast1'
      - '--platform'
      - 'managed'
      - '--port'
      - '8080'
      - '--allow-unauthenticated'

  # 2. Build Docker image for the frontend and push it to Artifact Registry
  # 2.1 Build and deploy the React Web Application
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - '-t'
      - 'northamerica-northeast1-docker.pkg.dev/prairiejoybaskets/pjb-arti-repo/prairiejoy-web:$COMMIT_SHA'
      - '-f'
      - 'Dockerfile'
      - '.'
  # 2.2 Push image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'northamerica-northeast1-docker.pkg.dev/prairiejoybaskets/pjb-arti-repo/prairiejoy-web:$COMMIT_SHA'
  # 2.3 Deploy image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'prairiejoy-web'
      - '--image'
      - 'northamerica-northeast1-docker.pkg.dev/prairiejoybaskets/pjb-arti-repo/prairiejoy-web:$COMMIT_SHA'
      - '--region'
      - 'northamerica-northeast1'
      - '--platform'
      - 'managed'
      - '--port'
      - '8080'
      - '--allow-unauthenticated'

  # 3. Update traffic to the latest revision of the deployed service
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args: ['run', 'services', 'update-traffic', 'prairiejoy-web', '--to-latest', '--region', 'northamerica-northeast1']

images:
  - 'northamerica-northeast1-docker.pkg.dev/prairiejoybaskets/pjb-arti-repo/prairiejoy-web:$COMMIT_SHA'
  - 'northamerica-northeast1-docker.pkg.dev/prairiejoybaskets/pjb-arti-repo/prairiejoy-api:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY

# Bind the predifined Cloud Build service account to the Cloud Run Invoker role for the deployed service.
serviceAccount: 'projects/prairiejoybaskets/serviceAccounts/cloud-build-sa@prairiejoybaskets.iam.gserviceaccount.com'
